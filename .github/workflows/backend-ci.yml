name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - master

  push:
    branches:
      - develop
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Backend Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Sonar necesita historial completo para blame/new code.
          fetch-depth: 0

      # ============================================================
      # JAVA / MAVEN
      # ============================================================

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          chmod +x mvnw
          ./mvnw -version

      # ============================================================
      # QUALITY GATE
      # Unit tests + ArchUnit + package + JaCoCo
      # ============================================================

      - name: Maven clean verify
        shell: bash
        run: |
          set -euo pipefail

          ./mvnw \
            -B \
            -ntp \
            --no-transfer-progress \
            clean verify

      # ============================================================
      # JACOCO
      # ============================================================

      - name: Assert JaCoCo coverage report exists
        shell: bash
        run: |
          set -euo pipefail

          test -s target/site/jacoco/jacoco.xml
          test -s target/site/jacoco/index.html

          echo "JaCoCo XML: target/site/jacoco/jacoco.xml"
          echo "JaCoCo HTML: target/site/jacoco/index.html"

      # ============================================================
      # SONARQUBE CLOUD
      #
      # develop es la Main Branch en SonarQube Cloud.
      #
      # Se ejecuta para TODOS los pull requests y los pushes a develop.
      # Los PR usan el analisis de PR (no branch analysis), de modo que
      # retargetear un PR entre master/develop no omite Sonar silenciosamente.
      # Se omiten pushes a master para evitar branch analysis no soportado
      # por la configuracion Free de SonarQube Cloud.
      # ============================================================

      - name: SonarQube Cloud analysis and Quality Gate
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${SONAR_TOKEN}" || {
            echo '::error::Missing required repository secret SONAR_TOKEN.'
            exit 1
          }
          test -n "${SONAR_ORGANIZATION}" || {
            echo '::error::Missing required repository variable SONAR_ORGANIZATION.'
            exit 1
          }
          test -n "${SONAR_PROJECT_KEY}" || {
            echo '::error::Missing required repository variable SONAR_PROJECT_KEY.'
            exit 1
          }

          ./mvnw \
            -B \
            -ntp \
            --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      # ============================================================
      # APPLICATION ARTIFACT
      # ============================================================

      - name: Assert packaged application artifact exists
        shell: bash
        run: |
          set -euo pipefail

          JAR="target/AsistenciasUCO-0.0.1-SNAPSHOT.jar"

          test -s "$JAR"

          echo "Packaged artifact: $JAR"
          sha256sum "$JAR"

      # ============================================================
      # CONTAINER
      # ============================================================

      - name: Build production Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --tag asistencias-uco-backend:${{ github.sha }} \
            .

      # ============================================================
      # CI ARTIFACTS
      # ============================================================

      - name: Upload Maven test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jacoco-report-${{ github.run_id }}
          path: |
            target/site/jacoco/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: asistencias-uco-backend-${{ github.sha }}
          path: target/AsistenciasUCO-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 14
