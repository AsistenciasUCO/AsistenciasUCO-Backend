spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  # LB-008 / JPA-02A: bootstrap JPA estandar de Spring Boot. Hibernate no administra el schema;
  # ddl-auto permanece deshabilitado y el acceso a metadata JDBC se controla desde la configuracion JPA.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  main:
    web-application-type: servlet
    keep-alive: true
  http:
    converters:
      # Boot 4 puede detectar Jackson 2 por dependencias transitivas del proveedor de identidad.
      # El valor "jackson" selecciona el mapper Jackson 3 configurado en Infrastructure.
      preferred-json-mapper: jackson
  threads:
    virtual:
      enabled: true
  # LB-004B.2: limite de 5 MiB alineado con ContentSecurityValidator.MAX_FILE_SIZE_BYTES.
  # El threshold igual al maximo contractual mantiene en memoria los archivos validos (<= 5 MiB).
  # Esto elimina persistencia contractual/local del archivo; no significa que la JVM no use
  # memoria transitoria durante la request.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

server:
  port: 8080

asistencias:
  swagger-ui:
    enabled: ${ASISTENCIAS_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

logging:
  file:
    name: ${ASISTENCIAS_UCO_LOG_FILE:infra/observability/logs/asistencias-uco.jsonl}
  logback:
    rollingpolicy:
      file-name-pattern: ${ASISTENCIAS_UCO_LOG_FILE_PATTERN:infra/observability/logs/asistencias-uco.%d{yyyy-MM-dd}.%i.jsonl}
      max-file-size: ${ASISTENCIAS_UCO_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${ASISTENCIAS_UCO_LOG_MAX_HISTORY:7}
      total-size-cap: ${ASISTENCIAS_UCO_LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false
  pattern:
    level: "%5p [correlationId:%X{correlationId:-},traceId:%X{traceId:-},spanId:%X{spanId:-}]"
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ASISTENCIAS_UCO_ENVIRONMENT:local}

# ──────────────────────────────────────────────────────────────
# app.adapters.*  -> QUÉ tecnología implementa cada capability (Composition Root).
# app.providers.* -> CÓMO se configura esa tecnología ya elegida.
# Ver docs/architecture/adapter-composition-standard.md
# ──────────────────────────────────────────────────────────────
app:
  # MAINT-003F: contrato UTC v2 de sesiones. OFF por defecto; activar solo cuando la DB del ambiente
  # tenga desplegado UTC-D06-POST-FREEZE (SesionV2SchemaCompatibilityVerifier lo comprueba al arrancar).
  sesiones:
    v2:
      enabled: ${APP_SESIONES_V2_ENABLED:false}
  adapters:
    identity:
      provider: ${APP_ADAPTERS_IDENTITY_PROVIDER:keycloak}
    security:
      provider: ${APP_ADAPTERS_SECURITY_PROVIDER:keycloak}
    vault:
      provider: ${APP_ADAPTERS_VAULT_PROVIDER:azure_keyvault}
    parameter-catalog:
      provider: ${APP_ADAPTERS_PARAMETER_CATALOG_PROVIDER:azure_appconfig}
    message-catalog:
      provider: ${APP_ADAPTERS_MESSAGE_CATALOG_PROVIDER:azure}
    storage:
      # LB-004B.2: minio es el unico provider soportado (decision humana, ver
      # docs/work-items/LB-004-stateless-serverless-readiness/PROFESSOR_DECISION.md). No hay
      # fallback local: un valor no soportado falla el arranque (fail-closed).
      provider: ${APP_ADAPTERS_STORAGE_PROVIDER:minio}
    realtime:
      provider: ${APP_ADAPTERS_REALTIME_PROVIDER:local-sse}
    audit:
      provider: ${APP_ADAPTERS_AUDIT_PROVIDER:logging}

  providers:
    # Azure Key Vault y App Configuration (autenticacion por DefaultAzureCredential con Azure CLI)
    azure-keyvault:
      endpoint: ${AZURE_KEYVAULT_ENDPOINT:https://kv-asist-dev-21245.vault.azure.net/}
    azure-appconfig:
      endpoint: ${AZURE_APPCONFIG_ENDPOINT:https://appcs-asist-dev-29183.azconfig.io}
    # Identity provisioning administrativo (crear/verificar/eliminar cuentas institucionales
    # y asignar client roles vía Admin REST API). NO confundir con keycloak-security: esto
    # nunca participa en la validación de JWT de cada request. Ver
    # docs/security/keycloak-identity-provider.md.
    keycloak-identity:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:asistencias-uco}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:asistencias-backend-admin}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      user-id-attribute: ${KEYCLOAK_USER_ID_ATTRIBUTE:idUsuario}
    # Runtime security (validacion de JWT). Ver
    # docs/security/runtime-security-provider-architecture.md.
    keycloak-security:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/asistencias-uco}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:asistencias-api}
      user-id-claim: ${KEYCLOAK_USER_ID_CLAIM:idUsuario}
    # LB-004B.2: MinIO privado (bucket provisionado por docker-compose/minio-init). Credenciales
    # SOLO por variables de entorno, sin valor por defecto funcional (fail-fast si faltan).
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:asistencias-soportes}
    # LB-004B.2: ClamAV local via protocolo clamd/INSTREAM.
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-millis: ${CLAMAV_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${CLAMAV_READ_TIMEOUT_MILLIS:15000}

  # CORS es neutral (no conoce ningun proveedor de identidad); SecurityConfig lo lee
  # directamente via @Value.
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    azure-events:
      # Sin valor por defecto funcional: vacio = webhook Event Grid rechaza todo (401, fail-closed).
      webhook-token: ${AZURE_EVENTGRID_WEBHOOK_TOKEN:}
