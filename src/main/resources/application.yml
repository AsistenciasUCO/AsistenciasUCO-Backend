spring:
  application:
    name: asistencias-uco
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.microsoft.sqlserver.jdbc.SQLServerDriver}
  # LB-008 / JPA-02A: bootstrap JPA estandar de Spring Boot. Hibernate no administra el schema;
  # ddl-auto permanece deshabilitado y el acceso a metadata JDBC se controla desde la configuracion JPA.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  main:
    web-application-type: servlet
    keep-alive: true
  http:
    converters:
      # Boot 4 puede detectar Jackson 2 por dependencias transitivas del proveedor de identidad.
      # El valor "jackson" selecciona el mapper Jackson 3 configurado en Infrastructure.
      preferred-json-mapper: jackson
  threads:
    virtual:
      enabled: true
  # LB-004B.2: limite de 5 MiB alineado con ContentSecurityValidator.MAX_FILE_SIZE_BYTES.
  # El threshold igual al maximo contractual mantiene en memoria los archivos validos (<= 5 MiB).
  # Esto elimina persistencia contractual/local del archivo; no significa que la JVM no use
  # memoria transitoria durante la request.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 5MB

server:
  port: 8080

asistencias:
  swagger-ui:
    enabled: ${ASISTENCIAS_SWAGGER_UI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          transport: http

logging:
  file:
    name: ${ASISTENCIAS_UCO_LOG_FILE:infra/observability/logs/asistencias-uco.jsonl}
  logback:
    rollingpolicy:
      file-name-pattern: ${ASISTENCIAS_UCO_LOG_FILE_PATTERN:infra/observability/logs/asistencias-uco.%d{yyyy-MM-dd}.%i.jsonl}
      max-file-size: ${ASISTENCIAS_UCO_LOG_MAX_FILE_SIZE:10MB}
      max-history: ${ASISTENCIAS_UCO_LOG_MAX_HISTORY:7}
      total-size-cap: ${ASISTENCIAS_UCO_LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false
  pattern:
    level: "%5p [correlationId:%X{correlationId:-},traceId:%X{traceId:-},spanId:%X{spanId:-}]"
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
        environment: ${ASISTENCIAS_UCO_ENVIRONMENT:local}

# ──────────────────────────────────────────────────────────────
# app.adapters.*  -> QUÉ tecnología implementa cada capability (Composition Root).
# app.providers.* -> CÓMO se configura esa tecnología ya elegida.
# Ver docs/architecture/adapter-composition-standard.md
# ──────────────────────────────────────────────────────────────
# Conexion al starter de MessageUcoLab (messageucolab-spring-boot-starter). El starter se autoconfigura aunque
# el provider activo sea otro, por eso hay valores por defecto inocuos; solo se consulta con
# app.adapters.message-catalog.provider=messageucolab. Los identificadores no son secretos (guia, paso 7).
messageucolab:
  url: ${MESSAGEUCOLAB_URL:http://localhost:8000}
  application-id: ${MESSAGEUCOLAB_APPLICATION_ID:}
  environment-id: ${MESSAGEUCOLAB_ENVIRONMENT_ID:}

app:
  # MAINT-003F: contrato UTC v2 de sesiones. Activo por defecto en local; el verificador comprueba
  # al arrancar que la DB del ambiente tenga desplegado UTC-D06-POST-FREEZE.
  sesiones:
    v2:
      enabled: ${APP_SESIONES_V2_ENABLED:true}
  # IDENT-001: limite de intentos por IP del endpoint publico de verificacion de correo (en memoria, por instancia).
  verificacion-correo:
    limite-por-minuto: ${VERIFICACION_CORREO_LIMITE_POR_MINUTO:20}
    max-claves: ${VERIFICACION_CORREO_MAX_CLAVES:10000}
  adapters:
    identity:
      # Un solo selector (APP_ADAPTERS_SECURITY_PROVIDER) gobierna seguridad e identidad; si se define este
      # valor explicitamente debe coincidir (el arranque falla ante una combinacion mixta).
      provider: ${APP_ADAPTERS_IDENTITY_PROVIDER:${APP_ADAPTERS_SECURITY_PROVIDER:baseline}}
    security:
      # Security Baseline es el proveedor predeterminado. `legacy` (Keycloak 8081) solo se activa de forma explicita
      # y una configuracion incompleta del baseline hace fallar el arranque: nunca degrada a legacy.
      provider: ${APP_ADAPTERS_SECURITY_PROVIDER:baseline}
    vault:
      provider: ${APP_ADAPTERS_VAULT_PROVIDER:azure_keyvault}
    parameter-catalog:
      provider: ${APP_ADAPTERS_PARAMETER_CATALOG_PROVIDER:azure_appconfig}
    message-catalog:
      # azure (predeterminado) | messageucolab (componente del equipo de mensajeria) | sqlserver.
      # Guia: AsistenciasUCO-Infra/docs/hardening/MESSAGE_CATALOG_SWITCH_GUIDE.md
      provider: ${APP_ADAPTERS_MESSAGE_CATALOG_PROVIDER:azure}
    storage:
      # LB-004B.2: minio es el unico provider soportado (decision humana, ver
      # docs/work-items/LB-004-stateless-serverless-readiness/PROFESSOR_DECISION.md). No hay
      # fallback local: un valor no soportado falla el arranque (fail-closed).
      provider: ${APP_ADAPTERS_STORAGE_PROVIDER:minio}
    realtime:
      provider: ${APP_ADAPTERS_REALTIME_PROVIDER:local-sse}
    audit:
      provider: ${APP_ADAPTERS_AUDIT_PROVIDER:logging}
    notification:
      provider: ${APP_ADAPTERS_NOTIFICATION_PROVIDER:log}     # log | outbox | composite
      composite:
        targets: ${APP_ADAPTERS_NOTIFICATION_COMPOSITE_TARGETS:log,outbox}   # solo aplica con provider=composite

  providers:
    # Solo aplica con app.adapters.message-catalog.provider=messageucolab (la conexion va en `messageucolab.*`).
    messageucolab:
      timeout: ${MESSAGEUCOLAB_TIMEOUT:3s}
      cache-ttl: ${MESSAGEUCOLAB_CACHE_TTL:5m}   # 0 desactiva; el gateway limita a 120 peticiones/min por IP
      fallback: ${MESSAGEUCOLAB_FALLBACK:azure}   # azure | none
      code-prefix: ${MESSAGEUCOLAB_CODE_PREFIX:MSG_}
      # Codigos canonicos de mas de 10 caracteres -> codigo corto de MessageUcoLab (el nombre canonico va en el titulo).
      # Generado por AsistenciasUCO-Infra/components/messages/build-message-catalog.py; la prueba MessageUcoLabCatalogoTest lo valida.
      code-aliases:
        "[ERR_CORRELACION_REQUERIDA]": ERR001
        "[ERR_USUARIO_NO_EXISTE]": ERR002
        "[ERR_UNICIDAD_CORREO]": ERR003
        "[ERR_UNICIDAD_DOCUMENTO]": ERR004
        "[ERR_ESTUDIANTE_NO_EXISTE]": ERR005
        "[ERR_MATRICULA_DUPLICADA]": ERR006
        "[ERR_ESTUDIANTE_NO_PERTENECE_SESION]": ERR007
        "[ERR_DOCENTE_NO_EXISTE]": ERR008
        "[ERR_DOCENTE_NO_TITULAR_GRUPO]": ERR009
        "[ERR_PROGRAMA_GRUPO_NO_ENCONTRADO]": ERR010
        "[ERR_GRUPO_NO_EXISTE]": ERR011
        "[ERR_GRUPO_NO_HABILITADO]": ERR012
        "[ERR_CUPO_SUPERADO]": ERR013
        "[ERR_CAPACIDAD_GRUPO_INVALIDA]": ERR014
        "[ERR_CUPO_INFERIOR_OCUPACION]": ERR015
        "[ERR_CRUCE_HORARIO_ESTUDIANTE]": ERR016
        "[ERR_CRUCE_HORARIO_DOCENTE]": ERR017
        "[ERR_SESION_NO_EXISTE]": ERR018
        "[ERR_TOKEN_VERIFICACION_INVALIDO]": ERR019
        "[ERR_PROGRAMA_FACULTAD_INCONSISTENTE]": ERR020
        "[ERR_SOLICITUD_MATRICULA_NO_IMPLEMENTADA]": ERR021
        "[ERR_INESPERADO_REGISTRO_ESTUDIANTE]": ERR022
        "[ERR_INESPERADO_REGISTRO_DOCENTE]": ERR023
        "[ERR_INESPERADO_REGISTRO_ASISTENCIA]": ERR024
        "[SUC_REGISTRO_ESTUDIANTE_GRUPO]": SUC001
        "[SUC_REGISTRO_DOCENTE_GRUPO]": SUC002
        "[SUC_REGISTRO_ASISTENCIA]": SUC003
    # Azure Key Vault y App Configuration (autenticacion por DefaultAzureCredential con Azure CLI)
    azure-keyvault:
      endpoint: ${AZURE_KEYVAULT_ENDPOINT:https://kv-asist-dev-21245.vault.azure.net/}
    azure-appconfig:
      endpoint: ${AZURE_APPCONFIG_ENDPOINT:https://appcs-asist-dev-29183.azconfig.io}
    # Identity provisioning administrativo (crear/verificar/eliminar cuentas institucionales
    # y asignar client roles vía Admin REST API). NO confundir con keycloak-security: esto
    # nunca participa en la validación de JWT de cada request. Ver
    # docs/security/keycloak-identity-provider.md.
    keycloak-identity:
      server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_REALM:asistencias-uco}
      admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:asistencias-backend-admin}
      admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      user-id-attribute: ${KEYCLOAK_USER_ID_ATTRIBUTE:idUsuario}
    # Aprovisionamiento de identidades del modo baseline (realm central). El secreto no tiene valor por defecto.
    security-baseline-identity:
      server-url: ${SECURITY_BASELINE_IDENTITY_SERVER_URL:http://localhost:19090}
      realm: ${SECURITY_BASELINE_IDENTITY_REALM:security-baseline}
      admin-client-id: ${SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_ID:asistencias-provisioner}
      admin-client-secret: ${SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_SECRET:}
      api-client-id: ${SECURITY_BASELINE_API_CLIENT_ID:asistencias-api}
      user-id-attribute: ${SECURITY_BASELINE_USER_ID_CLAIM:idUsuario}
    # Runtime security legacy (validacion de JWT). Ver
    # docs/security/runtime-security-provider-architecture.md.
    keycloak-security:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/asistencias-uco}
      api-client-id: ${KEYCLOAK_API_CLIENT_ID:asistencias-api}
      expected-audience: ${KEYCLOAK_EXPECTED_AUDIENCE:asistencias-api}
      user-id-claim: ${KEYCLOAK_USER_ID_CLAIM:idUsuario}
    security-baseline:
      issuer-uri: ${SECURITY_BASELINE_ISSUER_URI:http://keycloak.localhost:19090/realms/security-baseline}
      # Cliente de recurso propio de AsistenciasUCO en el realm central: aporta los cinco roles institucionales
      # (resource_access) y la audiencia del backend. No se usa security-baseline-pdp: ese cliente es del PDP.
      api-client-id: ${SECURITY_BASELINE_API_CLIENT_ID:asistencias-api}
      expected-audience: ${SECURITY_BASELINE_EXPECTED_AUDIENCE:asistencias-api}
      email-claim: ${SECURITY_BASELINE_EMAIL_CLAIM:email}
      email-verified-claim: ${SECURITY_BASELINE_EMAIL_VERIFIED_CLAIM:email_verified}
      # Atributo del IdP con Usuario.id (solo coherencia/UI; la autoridad es el vínculo issuer+subject en SQL Server).
      user-id-claim: ${SECURITY_BASELINE_USER_ID_CLAIM:idUsuario}
      # Opcional: solo transporte de las claves publicas (el `iss` se valida siempre contra issuer-uri). Vacio = descubrimiento OIDC.
      jwk-set-uri: ${SECURITY_BASELINE_JWK_SET_URI:}
    # Perfiles de acceso en el PDP: el backend asegura (idempotente) el perfil equivalente a cada rol que asigna.
    # La sincronizacion privilegiada permanece deshabilitada hasta validar la autorizacion administrativa del PDP.
    security-baseline-pdp-admin:
      enabled: ${SECURITY_BASELINE_PDP_PROFILE_SYNC_ENABLED:false}
      pdp-url: ${SECURITY_BASELINE_PDP_URL:http://localhost:18080}
      token-url: ${SECURITY_BASELINE_IDENTITY_SERVER_URL:http://localhost:19090}/realms/${SECURITY_BASELINE_IDENTITY_REALM:security-baseline}/protocol/openid-connect/token
      client-id: ${SECURITY_BASELINE_PDP_ADMIN_CLIENT_ID:asistencias-provisioner}
      # Secreto dedicado del PDP; no reutilizar SECURITY_BASELINE_IDENTITY_ADMIN_CLIENT_SECRET.
      client-secret: ${SECURITY_BASELINE_PDP_ADMIN_CLIENT_SECRET:}
      application-name: ${SECURITY_BASELINE_PEP_APPLICATION_NAME:asistencias-uco}
      # Perfil individual del PDP por rol (fuente unica: infra/security-baseline/access-catalog.json).
      profiles:
        ADMINISTRADOR: Administración institucional
        DECANO: Decanatura
        COORDINADOR: Coordinación de programa
        DOCENTE: Docencia
        ESTUDIANTE: Estudiantes
    # El modo baseline exige esta configuración; no existe una bandera adicional para apagarlo.
    security-baseline-pep:
      pep-url: ${SECURITY_BASELINE_PEP_URL:http://localhost:18081}
      application-name: ${SECURITY_BASELINE_PEP_APPLICATION_NAME:asistencias-uco}
      # Contrato 0.1.7: dev | lab | prod (el PDP rechaza cualquier otro valor al validar la credencial).
      environment: ${SECURITY_BASELINE_PEP_ENVIRONMENT:dev}
      application-credential: ${SECURITY_BASELINE_PEP_APPLICATION_CREDENTIAL:}
      connect-timeout: ${SECURITY_BASELINE_PEP_CONNECT_TIMEOUT:2s}
      request-timeout: ${SECURITY_BASELINE_PEP_REQUEST_TIMEOUT:5s}
    # LB-004B.2: MinIO privado (bucket provisionado por docker-compose/minio-init). Credenciales
    # SOLO por variables de entorno, sin valor por defecto funcional (fail-fast si faltan).
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:asistencias-soportes}
      # Acotan el bloqueo si MinIO acepta la conexion y no responde (el SDK espera 5 min por defecto).
      connect-timeout-millis: ${MINIO_CONNECT_TIMEOUT_MILLIS:5000}
      write-timeout-millis: ${MINIO_WRITE_TIMEOUT_MILLIS:30000}
      read-timeout-millis: ${MINIO_READ_TIMEOUT_MILLIS:30000}
    # LB-004B.2: ClamAV local via protocolo clamd/INSTREAM.
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout-millis: ${CLAMAV_CONNECT_TIMEOUT_MILLIS:5000}
      read-timeout-millis: ${CLAMAV_READ_TIMEOUT_MILLIS:15000}
    outbox-notification:
      sender: ${OUTBOX_NOTIFICATION_SENDER:log}               # log | smtp
      dispatcher-enabled: ${OUTBOX_NOTIFICATION_DISPATCHER_ENABLED:true}
      batch-size: ${OUTBOX_NOTIFICATION_BATCH_SIZE:50}        # 1..500
      lease: ${OUTBOX_NOTIFICATION_LEASE:60s}                 # 5s..1h
      sweeper-interval: ${OUTBOX_NOTIFICATION_SWEEPER_INTERVAL:30s}   # 1s..1h
      max-attempts: ${OUTBOX_NOTIFICATION_MAX_ATTEMPTS:5}     # 1..20
      backoff-base: ${OUTBOX_NOTIFICATION_BACKOFF_BASE:30s}   # 1s..1h
      backoff-max: ${OUTBOX_NOTIFICATION_BACKOFF_MAX:15m}     # >= base, <= 24h
      retention-days: ${OUTBOX_NOTIFICATION_RETENTION_DAYS:30}   # 1..3650
      retention-interval: ${OUTBOX_NOTIFICATION_RETENTION_INTERVAL:6h}
      instance-id: ${OUTBOX_NOTIFICATION_INSTANCE_ID:}        # vacío => <hostname>-<8 hex aleatorios>
    smtp-notification:
      host: ${SMTP_NOTIFICATION_HOST:}
      port: ${SMTP_NOTIFICATION_PORT:587}
      username: ${SMTP_NOTIFICATION_USERNAME:}
      password: ${SMTP_NOTIFICATION_PASSWORD:}                # nunca en el repositorio
      starttls: ${SMTP_NOTIFICATION_STARTTLS:true}
      ssl: ${SMTP_NOTIFICATION_SSL:false}
      from-address: ${SMTP_NOTIFICATION_FROM_ADDRESS:}
      from-name: ${SMTP_NOTIFICATION_FROM_NAME:Asistencia UCO}
      connect-timeout: ${SMTP_NOTIFICATION_CONNECT_TIMEOUT:10s}
      read-timeout: ${SMTP_NOTIFICATION_READ_TIMEOUT:20s}
      max-bcc: ${SMTP_NOTIFICATION_MAX_BCC:50}                # 1..100
      rate-per-minute: ${SMTP_NOTIFICATION_RATE_PER_MINUTE:60}     # 1..10000
      rate-per-day: ${SMTP_NOTIFICATION_RATE_PER_DAY:500}          # >= rate-per-minute
      require-confirmed-email: ${SMTP_NOTIFICATION_REQUIRE_CONFIRMED_EMAIL:false}
      platform-url: ${SMTP_NOTIFICATION_PLATFORM_URL:}        # vacío => el correo no incluye enlace (si se define: http:// o https://)
      template-cache-ttl: ${SMTP_NOTIFICATION_TEMPLATE_CACHE_TTL:60s}
      test-mode:
        enabled: ${SMTP_NOTIFICATION_TEST_MODE_ENABLED:false} # D15: true => redirige TODO a redirect-to
        redirect-to: ${SMTP_NOTIFICATION_TEST_MODE_REDIRECT_TO:} # 1..5 direcciones separadas por coma; obligatorio si enabled=true

  # CORS es neutral (no conoce ningun proveedor de identidad); SecurityConfig lo lee
  # directamente via @Value.
  security:
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
    azure-events:
      # Sin valor por defecto funcional: vacio = webhook Event Grid rechaza todo (401, fail-closed).
      webhook-token: ${AZURE_EVENTGRID_WEBHOOK_TOKEN:}
