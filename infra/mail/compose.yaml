name: asistencias-mail

# SMTP de PRUEBAS (GreenMail): recibe y retiene los correos del outbox en memoria; no los reenvia a ningun destinatario
# real. Es un componente auxiliar de la instalacion original, no un entorno duplicado. Sin volumen: el buzon se pierde
# al detener el contenedor (es lo esperado para pruebas).
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.api
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:${MAIL_SMTP_HOST_PORT:-3025}:3025"
      - "127.0.0.1:${MAIL_API_HOST_PORT:-8085}:8080"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3025"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
